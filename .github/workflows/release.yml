name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable release tag
        required: true
        default: v0.1.0
        type: string
      push_latest:
        description: Publish latest for stable releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: PiPhi-io/.github/.github/workflows/release-runtime.yml@56f0b24aabdce53d822e7cb91ffc7621d6602f71
    with:
      release_ref: ${{ inputs.release_ref }}
      image: docker.io/piphinetwork/piphi-network-huawei-solar
      language: python
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      push_latest: ${{ inputs.push_latest }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
